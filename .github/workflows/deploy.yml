name: Deploy (Docker Hub + Fly)

on:
  push:
    branches:
      - main

jobs:
  docker:
    name: Build and Push Docker Image (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Compute App Version
        run: echo "REACT_APP_VERSION=$((GITHUB_RUN_NUMBER + 44))" >> "$GITHUB_ENV"

      - name: Build client into server
        run: npm run build
        working-directory: client
        env:
          CI: false
          REACT_APP_GIT_SHA: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pokerface:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pokerface:${{ github.sha }}

  fly:
    name: Deploy to Fly.io (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Compute App Version
        run: echo "REACT_APP_VERSION=$((GITHUB_RUN_NUMBER + 44))" >> "$GITHUB_ENV"

      - name: Build client into server
        run: npm run build
        working-directory: client
        env:
          CI: false
          REACT_APP_GIT_SHA: ${{ github.sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
